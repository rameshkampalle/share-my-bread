name: Verify application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            backend/requirements-guardrails.txt
      - run: pip install -r requirements-dev.txt -r requirements-guardrails.txt
      - name: Require real NeMo runtime for compatibility tests
        run: python -c "import nemoguardrails, langchain_google_genai"
      - run: python -m compileall -q app
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  guardrail-evaluations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline evaluation and capture tests (no provider credentials)
        run: python -m unittest discover -s evals/tests -v
      - name: Workflow boundary tests
        run: node --test automation/tests/guardrails.test.mjs
      - name: Check generated workflow exports
        run: |
          node automation/scripts/generate-workflows.mjs
          git diff --exit-code -- automation/workflows
